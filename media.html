<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Media Tools — GPdI COTW Temanggung</title>
  <meta name="description" content="Social Media Tools GPdI COTW Temanggung.">

  <meta property="og:title" content="Social Media Tools — GPdI COTW Temanggung">
  <meta property="og:description" content="Social Media Tools GPdI COTW Temanggung.">
  <meta property="og:image" content="https://blessedcotw.github.io/og_preview.jpg">
  <meta property="og:url" content="https://blessedcotw.github.io/media.html">
  <meta property="og:site_name" content="GPdI COTW Temanggung">
  <meta property="og:locale" content="id_ID">

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Social Media Tools — GPdI COTW Temanggung">
  <meta name="twitter:description" content="Social Media Tools GPdI COTW Temanggung.">
  <meta name="twitter:image" content="https://blessedcotw.github.io/og_preview.jpg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" type="image/png" href="SuaraGembala/cotw_logo.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:ital,wght@0,400..700;1,400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
    rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Shared UI System Style (SuaraGembala) -->
  <link rel="stylesheet" href="SuaraGembala/styles.css">

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0f172a;
      padding: 20px 16px;
    }

    .linktree-container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      text-align: center;
    }

    .profile-header {
      margin-bottom: 32px;
    }

    .profile-logo {
      width: 110px;
      height: auto;
      margin-bottom: 16px;
      filter: drop-shadow(0 4px 12px rgba(245, 158, 11, 0.3));
      transition: transform 0.3s ease;
    }

    .profile-logo:hover {
      transform: scale(1.05);
    }

    .profile-subtitle {
      font-family: 'Great Vibes', cursive;
      font-size: 2.2rem;
      color: #ffffff;
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .profile-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent-gold);
      letter-spacing: -0.3px;
      margin-bottom: 8px;
    }

    .profile-desc {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .links-wrapper {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 36px;
    }

    .link-card {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      color: #ffffff;
      text-decoration: none;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .link-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--accent-gold);
      transition: width 0.25s ease;
    }

    .link-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent-gold);
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.25);
    }

    .link-card:hover::before {
      width: 6px;
    }

    .link-icon-box {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: var(--accent-gold);
      margin-right: 16px;
      flex-shrink: 0;
      transition: all 0.25s ease;
    }

    .link-card:hover .link-icon-box {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      border-color: var(--accent-gold);
    }

    .link-text-content {
      text-align: left;
      flex: 1;
    }

    .link-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 2px;
    }

    .link-desc {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .link-arrow {
      color: var(--text-muted);
      font-size: 1rem;
      transition: transform 0.25s ease, color 0.25s ease;
    }

    .link-card:hover .link-arrow {
      color: var(--accent-gold);
      transform: translateX(4px);
    }

    .social-footer {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 24px;
    }

    .social-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .social-btn:hover {
      color: var(--accent-gold);
      border-color: var(--accent-gold);
      transform: translateY(-2px);
      background: #0f172a;
    }

    .copyright {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="linktree-container">

    <!-- Profile Header -->
    <header class="profile-header">
      <img src="SuaraGembala/cotw_logo.png" alt="COTW Logo" class="profile-logo">
      <div class="profile-subtitle">Social Media Tools</div>
      <h1 class="profile-title">GPdI COTW Temanggung</h1>
      <p class="profile-desc">Pilih aplikasi yang ingin Anda gunakan:</p>
    </header>

    <!-- Linktree Menu Links -->
    <div class="links-wrapper">

      <!-- Link 1: Suara Gembala Generator -->
      <a href="SuaraGembala" class="link-card">
        <div class="link-icon-box">
          <i class="fa-solid fa-book-bible"></i>
        </div>
        <div class="link-text-content">
          <div class="link-title">Suara Gembala</div>
          <div class="link-desc">Ayat Harian & Teks Refleksi</div>
        </div>
        <div class="link-arrow">
          <i class="fa-solid fa-chevron-right"></i>
        </div>
      </a>

      <!-- Link 2: Renungan Pagi Generator -->
      <a href="RenunganPagi" class="link-card">
        <div class="link-icon-box">
          <i class="fa-solid fa-sun"></i>
        </div>
        <div class="link-text-content">
          <div class="link-title">Renungan Pagi</div>
          <div class="link-desc">Renungan Pagi dari GPdI COTW Temanggung</div>
        </div>
        <div class="link-arrow">
          <i class="fa-solid fa-chevron-right"></i>
        </div>
      </a>

    </div>

    <!-- Footer Links & Social Media -->
    <footer>
      <div class="social-footer">
        <a href="https://www.youtube.com/@GPdICOTWTemanggung" target="_blank" rel="noopener" class="social-btn"
          title="YouTube Channel">
          <i class="fa-brands fa-youtube"></i>
        </a>
        <a href="https://www.instagram.com/gpdicotw_temanggung" target="_blank" rel="noopener" class="social-btn"
          title="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
      </div>
      <div class="copyright">
        © GPdI Church on the Way Temanggung
      </div>
    </footer>

  </div>

</body>

</html>
