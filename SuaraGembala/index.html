<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suara Gembala GPdI COTW Temanggung</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" type="image/png" href="cotw_logo.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:ital,wght@0,400..700;1,400..700&family=Playfair+Display+SC:wght@400;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
    rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="app-container">

    <!-- Top Bar: Minimal Header -->
    <header class="minimal-header">
      <div class="brand">
        <img src="cotw_logo.png" alt="COTW Logo" class="brand-logo">
        <span class="brand-title">Suara Gembala GPdI COTW Temanggung</span>
      </div>
    </header>

    <main class="main-content">
      <!-- Left Panel: Form & Controls stacked vertically -->
      <section class="control-panel">

        <div class="card">
          <div class="card-header">
            <h3><i class="fa-solid fa-image"></i> Pilih Latar</h3>
            <div class="card-header-btns">
              <button id="refreshBgBtn" class="btn-icon" title="Acak 10 Background Baru">
                <i class="fa-solid fa-rotate"></i> Acak 10 Foto Baru
              </button>
              <button id="searchBgBtn" class="btn-icon" title="Cari Foto dengan Kata Kunci">
                <i class="fa-solid fa-magnifying-glass"></i> Cari Foto
              </button>
            </div>
          </div>

          <div id="bgGrid" class="bg-grid">
            <div class="bg-loading">Memuat foto nature...</div>
          </div>

          <div class="opacity-control">
            <label for="opacityInput">Opacity Latar: <strong id="opacityVal">25%</strong></label>
            <input type="range" id="opacityInput" min="0.1" max="1.0" step="0.05" value="0.25" class="range-slider">
          </div>
        </div>

        <!-- SECTION 2: Form Ayat & Konten (Di Bawah Latar) -->
        <div class="card">
          <div class="card-header">
            <h3><i class="fa-solid fa-pen-to-square"></i> Konten Ayat</h3>
          </div>

          <div class="form-group">
            <label for="nativeDateInput">Tanggal Ayat</label>
            <div class="native-date-wrapper">
              <input type="text" id="dateDisplayText" class="form-control readable-date-input" readonly
                placeholder="Selasa, 11 Agustus 2026">
              <input type="date" id="nativeDateInput" class="hidden-native-date">
              <button type="button" id="triggerNativeDateBtn" class="btn-icon calendar-trigger-btn"
                title="Buka Kalender Browser">
                <i class="fa-regular fa-calendar-days"></i>
              </button>
            </div>
          </div>


          <div class="form-group">
            <label for="verseInput">Isi Teks Ayat</label>
            <textarea id="verseInput" class="form-control" rows="4" placeholder="Masukkan teks ayat..."></textarea>
          </div>

          <div class="form-group">
            <label for="refInput">Nomor Ayat / Referensi</label>
            <input type="text" id="refInput" class="form-control" placeholder="misal: Mazmur 1:1">
          </div>

          <div class="form-group">
            <label for="reflectionInput">Teks Refleksi</label>
            <textarea id="reflectionInput" class="form-control" rows="3"
              placeholder="Masukkan teks refleksi..."></textarea>
          </div>
        </div>

      </section>

      <!-- Right Panel: Live Preview Canvas -->
      <section class="preview-panel">
        <div class="canvas-card">
          <div class="canvas-wrapper">
            <canvas id="previewCanvas" width="1080" height="1920"></canvas>
          </div>
          <div class="canvas-controls">
            <button id="downloadBtn" class="btn btn-primary">
              <i class="fa-solid fa-download"></i> Download PNG
            </button>
          </div>
        </div>
      </section>
    </main>

  </div>

  <!-- Search Modal Popup -->
  <div id="searchModal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3><i class="fa-solid fa-magnifying-glass"></i> Cari Foto Latar</h3>
        <button id="closeModalBtn" class="modal-close-btn">&times;</button>
      </div>
      <form id="searchForm" class="modal-body">
        <label for="keywordInput">Masukkan kata kunci pencarian (misal: <em>cross, mountain, sunset, forest, sky, river,
            church</em>):</label>
        <div class="search-input-group">
          <input type="text" id="keywordInput" class="form-control" placeholder="Contoh: mountain sunset..." autofocus>
          <button type="submit" class="btn btn-primary">Cari</button>
        </div>
      </form>
    </div>
  </div>

  </div>

  <script src="app.js"></script>
</body>

</html>
