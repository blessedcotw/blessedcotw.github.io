name: Generate SongRepo Userdata Bundle

on:
  push:
    paths:
      - 'library/*.txt'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Library Bundle & Manifest
        run: |
          python -c "
          import os, json, glob, datetime

          files = sorted(glob.glob('library/*.txt'))
          bundle_songs = []
          manifest_files = []

          for fpath in files:
              fname = os.path.basename(fpath)
              if fname in ('library-manifest.json', 'library-bundle.json'):
                  continue
              manifest_files.append(fname)
              with open(fpath, 'r', encoding='utf-8', errors='ignore') as f:
                  text = f.read()
              
              lines = [ln.strip() for ln in text.strip().split('\n') if ln.strip()]
              title = fname.replace('.txt', '')
              if lines and lines[0].lower().startswith('title:'):
                  title = lines[0].split(':', 1)[1].strip()
              elif lines:
                  title = lines[0].replace('Judul:', '').strip()

              bundle_songs.append({
                  'filename': fname,
                  'title': title,
                  'text': text
              })

          with open('library/library-manifest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest_files, f, indent=2)

          bundle_data = {
              'updatedAt': datetime.datetime.now().isoformat(),
              'totalSongs': len(bundle_songs),
              'songs': bundle_songs
          }
          with open('library/library-bundle.json', 'w', encoding='utf-8') as f:
              json.dump(bundle_data, f, indent=2)
          "

      - name: Commit and Push Bundle
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add library/library-manifest.json library/library-bundle.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate library-bundle.json & manifest [skip ci]" && git push)
